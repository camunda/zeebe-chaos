<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' width='760' height='300' role='img'><title>Goodput of stuck and recovered daily runs</title><desc>Stuck runs accepted 744 requests per second against 994 and wrote 3718 records per second against 4967</desc><rect width='760' height='300' fill='#ffffff'/><text x='30' y='28' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#1f2937' text-anchor='start' font-weight='bold'>Daily None-gRPC load test, stuck vs recovered runs (median)</text><text x='30' y='60' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1f2937' text-anchor='start' font-weight='bold'>accepted requests per second</text><rect x='30' y='80' width='271.1' height='30' fill='#0f766e' fill-opacity='0.85'/><text x='30' y='128' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>recovered (4 runs)</text><text x='307.0909090909091' y='100' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1f2937' text-anchor='start' font-weight='normal'>994</text><rect x='30' y='140' width='202.9' height='30' fill='#b45309' fill-opacity='0.85'/><text x='30' y='188' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>stuck (6 runs)</text><text x='238.9090909090909' y='160' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1f2937' text-anchor='start' font-weight='normal'>744</text><text x='400' y='60' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1f2937' text-anchor='start' font-weight='bold'>records per second</text><rect x='400' y='80' width='286.6' height='30' fill='#0f766e' fill-opacity='0.85'/><text x='400' y='128' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>recovered (4 runs)</text><text x='692.5576923076924' y='100' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1f2937' text-anchor='start' font-weight='normal'>4967</text><rect x='400' y='140' width='214.5' height='30' fill='#b45309' fill-opacity='0.85'/><text x='400' y='188' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>stuck (6 runs)</text><text x='620.5' y='160' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#1f2937' text-anchor='start' font-weight='normal'>3718</text><text x='30' y='250' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>Both groups burned the same CPU (8.6 vs 8.7 cores), so the stuck runs delivered about 25% fewer records on the same hardware.</text><text x='30' y='270' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal'>Stuck = more than 35% rejected, recovered = less than 15% rejected, 4 runs in between left out. Last 14 days before 2026-11-05.</text></svg>