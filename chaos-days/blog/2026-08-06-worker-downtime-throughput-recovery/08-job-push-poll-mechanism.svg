<svg viewBox="0 0 1240 740" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Diagram of a Camunda job worker's client-side job intake. The push stream and the poll loop both deliver into a single non-fair semaphore sized by maxJobsActive, and three defects sit on the poll side. Defect 1: the poll budget does not count pushed jobs, so every poll over-requests work the worker cannot accept. Defect 2: a rejected job never decrements the in-flight counter, so once the leak passes thirty percent of capacity the worker stops polling permanently and nothing re-arms the loop. Defect 3: a poll batch is dispatched one job at a time while blocking on the semaphore, so the tail of a batch is past its deadline before it starts, causing duplicate execution. A closed loop at the bottom runs from the ACTIVATABLE backlog to activated, to rejected client-side, to broker timeout, and back to the backlog, making no forward progress.">
  <style>
    svg {
      --bg:#f4f5f8; --ink:#1c2230; --muted:#5b6472;
      --panel:#ffffff; --panel-border:#c7ccd6; --band-border:#dfe2e8;
      --push:#c9711f; --push-soft:rgba(201,113,31,0.14);
      --pull:#2f5f8a;
      --warn:#a23b2e; --warn-soft:rgba(162,59,46,0.12);
      --ghost-border:#c7ccd6; --ghost-text:#9aa2af;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#12151c; --ink:#e6e9ef; --muted:#9aa4b2;
        --panel:#1b1f29; --panel-border:#333a48; --band-border:#242938;
        --push:#e6a24f; --push-soft:rgba(230,162,79,0.18);
        --pull:#7ea3cc;
        --warn:#d97a63; --warn-soft:rgba(217,122,99,0.16);
        --ghost-border:#333a48; --ghost-text:#6b7280;
      }
    }
    .bgrect { fill: var(--bg); }
    .title { fill: var(--ink); font-size: 21px; font-weight: 600; text-anchor: middle; }
    .subtitle { fill: var(--muted); font-size: 12.5px; text-anchor: middle; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .band { fill: none; stroke: var(--band-border); stroke-width: 1.5; rx: 14; }
    .band-label { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.5; rx: 8; }
    .box-warn { fill: var(--panel); stroke: var(--warn); stroke-width: 2; rx: 8; }
    .box-pull { fill: var(--panel); stroke: var(--pull); stroke-width: 2; rx: 8; }
    .box-push { fill: var(--panel); stroke: var(--push); stroke-width: 2; rx: 8; }
    .box-neutral { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; rx: 10; }
    .boxtitle { fill: var(--ink); font-size: 13px; text-anchor: middle; font-weight: 600; }
    .boxsub { fill: var(--muted); font-size: 10px; text-anchor: middle; }
    .foot-push { fill: var(--push); font-size: 10.5px; text-anchor: middle; font-weight: 600; }
    .foot-warn { fill: var(--warn); font-size: 10.5px; text-anchor: middle; font-weight: 600; }
    .decision { fill: var(--ink); font-size: 11.5px; text-anchor: middle; font-weight: 600; }
    .note { fill: var(--muted); font-size: 10.5px; }
    .note-warn { fill: var(--warn); font-size: 10.5px; font-weight: 600; }
    .strip-label { fill: var(--muted); font-size: 11px; }
    .push-line { stroke: var(--push); stroke-width: 2.5; fill: none; }
    .pull-line { stroke: var(--pull); stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; }
    .warn-line { stroke: var(--warn); stroke-width: 2; fill: none; stroke-dasharray: 4 4; }
    .ink-line { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .arrowhead-push { fill: var(--push); }
    .arrowhead-pull { fill: var(--pull); }
    .arrowhead-warn { fill: var(--warn); }
    .arrowhead-ink { fill: var(--ink); }
    .slot-full { fill: var(--push-soft); stroke: var(--push); stroke-width: 1.5; rx: 4; }
    .slot-ghost { fill: var(--panel); stroke: var(--ghost-border); stroke-width: 1.5; stroke-dasharray: 3 3; rx: 4; }
    .slot-glyph { fill: var(--push); font-size: 12px; text-anchor: middle; }
    .reject-mark { fill: var(--warn); font-size: 16px; text-anchor: middle; font-weight: 700; }
    .chip-warn { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; rx: 4; }
    .legend-text { fill: var(--ink); font-size: 11px; }
  </style>

  <defs>
    <marker id="aPush" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-push" />
    </marker>
    <marker id="aPull" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-pull" />
    </marker>
    <marker id="aWarn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-warn" />
    </marker>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-ink" />
    </marker>
  </defs>

  <rect class="bgrect" x="0" y="0" width="1240" height="740" />

  <text class="title" x="620" y="34">At the worker: one pool, two paths, three defects</text>
  <text class="subtitle" x="620" y="56">Push and poll share one non-fair semaphore, and the poll side is the fragile one when it loses the race</text>

  <g transform="translate(0,-276)">
  <rect class="band" x="40" y="356" width="1160" height="612" />
  <text class="band-label" x="64" y="380">ONE POOL, TWO PATHS, THREE DEFECTS</text>

  <rect class="box-push" x="80" y="398" width="290" height="72" />
  <text class="boxtitle" x="225" y="422">Push stream (gRPC)</text>
  <text class="boxsub" x="225" y="440">JobStreamerImpl</text>
  <text class="boxsub" x="225" y="456">onNext blocks on the shared semaphore</text>

  <rect class="box-pull" x="400" y="398" width="390" height="72" />
  <text class="boxtitle" x="595" y="422">Poll loop (REST by default)</text>
  <text class="boxsub" x="595" y="440">asks for maxJobsActive &#8722; remainingJobs</text>
  <text class="boxsub" x="595" y="456">remainingJobs counts poll-delivered jobs only</text>

  <rect class="box-warn" x="820" y="398" width="380" height="72" />
  <text class="boxtitle" x="1010" y="422" style="fill:var(--warn);">Defect 1 &#183; blind budget</text>
  <text class="boxsub" x="1010" y="440">pushed jobs hold permits without being counted,</text>
  <text class="boxsub" x="1010" y="456">so every poll over-requests what it cannot take</text>

  <path class="push-line" d="M 225,470 V 512" marker-end="url(#aPush)" />
  <path class="pull-line" d="M 500,470 V 512" marker-end="url(#aPull)" />

  <text class="strip-label" x="80" y="534">shared capacity &#183; one non-fair Semaphore(maxJobsActive) serving both paths</text>
  <rect class="slot-full" x="80" y="546" width="66" height="32" /><text class="slot-glyph" x="113" y="567">&#9889;</text>
  <rect class="slot-full" x="155" y="546" width="66" height="32" /><text class="slot-glyph" x="188" y="567">&#9889;</text>
  <rect class="slot-full" x="230" y="546" width="66" height="32" /><text class="slot-glyph" x="263" y="567">&#9889;</text>
  <rect class="slot-full" x="305" y="546" width="66" height="32" /><text class="slot-glyph" x="338" y="567">&#9889;</text>
  <rect class="slot-full" x="380" y="546" width="66" height="32" /><text class="slot-glyph" x="413" y="567">&#9889;</text>
  <rect class="slot-ghost" x="455" y="546" width="66" height="32" /><text class="reject-mark" x="488" y="568">&#10007;</text>
  <rect class="slot-ghost" x="530" y="546" width="66" height="32" />
  <rect class="slot-ghost" x="605" y="546" width="66" height="32" />
  <text class="note" x="80" y="600">push arrives fresh on each onNext and can barge past a waiting poll job</text>

  <rect class="box-warn" x="700" y="500" width="500" height="98" />
  <text class="boxtitle" x="950" y="524" style="fill:var(--warn);">Defect 3 &#183; a poll batch is dispatched one job at a time</text>
  <text class="boxsub" x="950" y="544">jobs.forEach blocks per job on tryAcquire(timeout)</text>
  <text class="boxsub" x="950" y="561">the tail of a batch is past its deadline before it starts</text>
  <text class="foot-warn" x="950" y="581">duplicate execution, rejected completions</text>

  <rect class="box" x="80" y="622" width="590" height="116" />
  <text class="boxtitle" x="375" y="646">Defect 2 &#183; polling can stop permanently</text>
  <text class="boxsub" x="375" y="666">a rejected job never runs, so remainingJobs is never decremented</text>
  <text class="boxsub" x="375" y="683">once the leak passes Math.round(maxJobsActive x 0.3), shouldPoll is false</text>
  <text class="boxsub" x="375" y="700">onScheduledPoll returns without rescheduling, nothing re-arms it</text>
  <text class="boxsub" x="375" y="722">reproduced in a test, not observed in this run</text>

  <path class="ink-line" d="M 488,578 V 622" marker-end="url(#aInk)" />

  <!-- churn loop -->
  <text class="band-label" x="64" y="772">THE LOOP THIS CREATES</text>

  <rect class="box-warn" x="80" y="788" width="240" height="60" />
  <text class="boxtitle" x="200" y="812">ACTIVATABLE backlog</text>
  <text class="boxsub" x="200" y="829">waiting to be polled</text>

  <rect class="box" x="370" y="788" width="240" height="60" />
  <text class="boxtitle" x="490" y="812">Polled &#8594; ACTIVATED</text>
  <text class="boxsub" x="490" y="829">broker deadline starts ticking</text>

  <rect class="box" x="660" y="788" width="240" height="60" />
  <text class="boxtitle" x="780" y="812">Rejected client-side</text>
  <text class="boxsub" x="780" y="829">dropped, broker is not told</text>

  <rect class="box" x="950" y="788" width="240" height="60" />
  <text class="boxtitle" x="1070" y="812">TIME_OUT on the broker</text>
  <text class="boxsub" x="1070" y="829">notify only, never pushed</text>

  <path class="warn-line" d="M 320,818 H 362" marker-end="url(#aWarn)" />
  <path class="warn-line" d="M 610,818 H 652" marker-end="url(#aWarn)" />
  <path class="warn-line" d="M 900,818 H 942" marker-end="url(#aWarn)" />
  <path class="warn-line" d="M 1070,848 V 888 H 200 V 850" marker-end="url(#aWarn)" />

  <text class="note" x="80" y="924">Records are written on every lap while the job itself makes no progress.</text>
  <text class="note" x="80" y="946">Both failure paths recover into ACTIVATABLE, which polling alone serves, so recovery depends on the poll loop getting a turn.</text>

  <!-- legend -->
  <line x1="80" y1="990" x2="118" y2="990" class="push-line" />
  <text class="legend-text" x="128" y="994">push</text>
  <line x1="185" y1="990" x2="223" y2="990" class="pull-line" />
  <text class="legend-text" x="233" y="994">poll</text>
  <line x1="285" y1="990" x2="323" y2="990" class="warn-line" />
  <text class="legend-text" x="333" y="994">failure / churn path</text>
  <rect x="470" y="982" width="30" height="16" class="slot-full" />
  <text class="legend-text" x="510" y="994">permit held by a pushed job</text>
  <rect x="700" y="982" width="30" height="16" class="slot-ghost" />
  <text class="legend-text" x="740" y="994">free permit</text>
  </g>
</svg>
