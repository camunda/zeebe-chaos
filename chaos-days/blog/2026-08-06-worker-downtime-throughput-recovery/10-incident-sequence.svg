<svg viewBox="0 0 1400 1180" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Sequence diagram of the whole chaos day, from the outage to the drain, in six phases. Phase one, 09:43 CEST, the outage begins: we scale the extract-data-from-document worker to zero replicas while the starter keeps creating one process instance per second, so jobs for that type accumulate in the ACTIVATABLE backlog and active instances climb in a straight line. Phase two, 11:04 CEST, the worker returns: it polls its roughly 4800 job backlog and drains it in about ten minutes, but every completion fans out into about 150 downstream jobs across three job types, so the backlog climbs faster than before. Phase three, 11:15 to 13:15, the inversion: the broker pushes newly created jobs straight to a worker, and a pushed job never enters ACTIVATABLE, so the standing backlog can only be drained by polling, which is competing for the same sixty permits that push keeps taking. The downstream workers sit pinned at their capacity for five hours and active instances keep climbing to a peak around 13:00. Phase four, 14:52 and 15:26, we add capacity: raising maxJobsActive from 60 to 100 and replicas from one to three lifts the handled rate from about 90 to about 230 per second, but it also pushes the configuration past the bound of execution threads times timeout over handler duration, so the tail of every batch is expired before it starts, and broker-side JOB.TIME_OUT and JOB.COMPLETE rejections climb. The backlog stays flat. Phase five, 15:59 to 16:08, the reclaim attempt: we scale five workers to zero to hand their capacity to the bottleneck and raise it to five replicas, but every proof-from-vendor job we complete creates a get-vendor-info job whose worker we have just stopped, so the queue moves one task downstream rather than shrinking, and we revert everything to one replica. Phase six, 16:15 to about 16:50, the starter is stopped: with no new instances being created there is nothing left to push, the poll path is finally uncontested, and the ACTIVATABLE backlog drains within about thirty five minutes.">
  <style>
    svg {
      --bg:#f4f5f8; --ink:#1c2230; --muted:#5b6472;
      --panel:#ffffff; --panel-border:#c7ccd6; --band-border:#dfe2e8;
      --bandfill:rgba(28,34,48,0.025);
      --push:#c9711f; --push-soft:rgba(201,113,31,0.12);
      --pull:#2f5f8a; --pull-soft:rgba(47,95,138,0.12);
      --warn:#a23b2e; --warn-soft:rgba(162,59,46,0.10);
      --good:#2f6b4f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg:not([data-theme="light"]) {
        --bg:#12151c; --ink:#e6e9ef; --muted:#9aa4b2;
        --panel:#1b1f29; --panel-border:#333a48; --band-border:#242938;
        --bandfill:rgba(230,233,239,0.03);
        --push:#e6a24f; --push-soft:rgba(230,162,79,0.16);
        --pull:#7ea3cc; --pull-soft:rgba(126,163,204,0.16);
        --warn:#d97a63; --warn-soft:rgba(217,122,99,0.14);
        --good:#7fb79a;
      }
    }
    svg[data-theme="dark"] {
      --bg:#12151c; --ink:#e6e9ef; --muted:#9aa4b2;
      --panel:#1b1f29; --panel-border:#333a48; --band-border:#242938;
      --bandfill:rgba(230,233,239,0.03);
      --push:#e6a24f; --push-soft:rgba(230,162,79,0.16);
      --pull:#7ea3cc; --pull-soft:rgba(126,163,204,0.16);
      --warn:#d97a63; --warn-soft:rgba(217,122,99,0.14);
      --good:#7fb79a;
    }
    .bgrect { fill: var(--bg); }
    .title { fill: var(--ink); font-size: 21px; font-weight: 600; text-anchor: middle; }
    .subtitle { fill: var(--muted); font-size: 12.5px; text-anchor: middle; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .bandrect { fill: var(--bandfill); stroke: var(--band-border); stroke-width: 1; rx: 10; }
    .box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.5; rx: 8; }
    .actor { fill: var(--ink); font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    .actor-sub { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
    .life { stroke: var(--panel-border); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .time { fill: var(--ink); font-size: 13px; font-weight: 700; }
    .phase { fill: var(--ink); font-size: 12px; }
    .trend-up { fill: var(--warn); font-size: 10.5px; font-weight: 600; }
    .trend-flat { fill: var(--muted); font-size: 10.5px; font-weight: 600; }
    .trend-down { fill: var(--good); font-size: 10.5px; font-weight: 600; }
    .arrow { stroke: var(--pull); stroke-width: 1.8; fill: none; }
    .arrow-push { stroke: var(--push); stroke-width: 2; fill: none; }
    .arrow-warn { stroke: var(--warn); stroke-width: 2; fill: none; }
    .arrow-op { stroke: var(--ink); stroke-width: 1.8; fill: none; }
    .msg { fill: var(--ink); font-size: 12px; text-anchor: middle; }
    .note { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
    .note-warn { fill: var(--warn); font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .note-push { fill: var(--push); font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .notebox { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.4; rx: 6; }
    .noteboxw { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.4; rx: 6; }
    .noteboxp { fill: var(--push-soft); stroke: var(--push); stroke-width: 1.4; rx: 6; }
    .boxtext { fill: var(--ink); font-size: 11px; text-anchor: middle; }
    .term { stroke: var(--muted); stroke-width: 2.2; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pull)"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--push)"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink)"/>
    </marker>
  </defs>

  <rect class="bgrect" x="0" y="0" width="1400" height="1180"/>

  <text class="title" x="700" y="42">The whole day, in six phases</text>
  <text class="subtitle" x="700" y="66">Where the backlog came from, why adding capacity did not shift it, and what finally did</text>

  <!-- ============ actors ============ -->
  <rect class="box" x="300"  y="95" width="160" height="46"/>
  <text class="actor"     x="380" y="116">Us</text>
  <text class="actor-sub" x="380" y="132">kubectl</text>

  <rect class="box" x="490"  y="95" width="160" height="46"/>
  <text class="actor"     x="570" y="116">Starter</text>
  <text class="actor-sub" x="570" y="132">1 instance/s</text>

  <rect class="box" x="690"  y="95" width="200" height="46"/>
  <text class="actor"     x="790" y="116">Broker</text>
  <text class="actor-sub" x="790" y="132">partition + ACTIVATABLE</text>

  <rect class="box" x="930"  y="95" width="200" height="46"/>
  <text class="actor"     x="1030" y="116">extract worker</text>
  <text class="actor-sub" x="1030" y="132">the one we killed</text>

  <rect class="box" x="1170" y="95" width="200" height="46"/>
  <text class="actor"     x="1270" y="116">downstream workers</text>
  <text class="actor-sub" x="1270" y="132">proof, vendor-info, refunding</text>

  <line class="life" x1="380"  y1="141" x2="380"  y2="1140"/>
  <line class="life" x1="570"  y1="141" x2="570"  y2="1073"/>
  <line class="life" x1="790"  y1="141" x2="790"  y2="1140"/>
  <line class="life" x1="1030" y1="141" x2="1030" y2="1140"/>
  <line class="life" x1="1270" y1="141" x2="1270" y2="1140"/>

  <!-- ============ phase 1 ============ -->
  <rect class="bandrect" x="46" y="160" width="1308" height="150"/>
  <text class="time"     x="62" y="190">09:43 CEST</text>
  <text class="phase"    x="62" y="210">Outage begins</text>
  <text class="trend-up" x="62" y="232">instances: climbing</text>
  <text class="trend-up" x="62" y="247">in a straight line</text>

  <text class="msg" x="705" y="192">scale to 0 replicas</text>
  <line class="arrow-op" x1="386" y1="201" x2="1024" y2="201" marker-end="url(#ao)"/>

  <text class="msg" x="680" y="241">create process instance</text>
  <line class="arrow" x1="576" y1="250" x2="784" y2="250" marker-end="url(#a)"/>
  <text class="note" x="680" y="266">1/s, never paused</text>

  <rect class="notebox" x="640" y="272" width="300" height="28"/>
  <text class="boxtext" x="790" y="291">jobs pile up in ACTIVATABLE, nothing serves them</text>

  <!-- ============ phase 2 ============ -->
  <rect class="bandrect" x="46" y="320" width="1308" height="150"/>
  <text class="time"     x="62" y="350">11:04 CEST</text>
  <text class="phase"    x="62" y="370">Worker returns</text>
  <text class="trend-up" x="62" y="392">instances: climbing</text>
  <text class="trend-up" x="62" y="407">faster than before</text>

  <text class="msg" x="705" y="352">scale back to 1 replica</text>
  <line class="arrow-op" x1="386" y1="361" x2="1024" y2="361" marker-end="url(#ao)"/>

  <text class="msg" x="910" y="399">poll: ~4,800 jobs, drained in ~10 min</text>
  <line class="arrow" x1="1024" y1="408" x2="796" y2="408" marker-end="url(#a)"/>

  <rect class="noteboxp" x="900" y="424" width="440" height="34"/>
  <text class="boxtext" x="1120" y="445">every completion fans out into ~150 downstream jobs (50 x 3 types)</text>

  <!-- ============ phase 3 ============ -->
  <rect class="bandrect" x="46" y="480" width="1308" height="190"/>
  <text class="time"       x="62" y="510">11:15 to 13:15</text>
  <text class="phase"      x="62" y="530">The inversion</text>
  <text class="trend-up"   x="62" y="552">instances: still</text>
  <text class="trend-up"   x="62" y="567">climbing, peak 13:00</text>

  <text class="msg" x="1030" y="512">push: new jobs handed straight to a worker</text>
  <line class="arrow-push" x1="796" y1="521" x2="1264" y2="521" marker-end="url(#ap)"/>
  <text class="note-push" x="1030" y="537">a pushed job never enters ACTIVATABLE</text>

  <text class="msg" x="1030" y="575">poll: the only path that reaches the backlog</text>
  <line class="arrow" x1="1264" y1="584" x2="796" y2="584" marker-end="url(#a)"/>
  <text class="note" x="1030" y="600">competing for the same 60 permits push keeps taking</text>

  <rect class="noteboxw" x="1055" y="616" width="285" height="34"/>
  <text class="boxtext" x="1197" y="637">pinned at maxJobsActive for five hours</text>

  <!-- ============ phase 4 ============ -->
  <rect class="bandrect" x="46" y="680" width="1308" height="170"/>
  <text class="time"       x="62" y="710">14:52 and 15:26</text>
  <text class="phase"      x="62" y="730">We add capacity</text>
  <text class="trend-flat" x="62" y="752">instances: flat,</text>
  <text class="trend-flat" x="62" y="767">no change at all</text>

  <text class="msg" x="825" y="712">capacity 60 to 100, then 1 to 3 replicas</text>
  <line class="arrow-op" x1="386" y1="721" x2="1264" y2="721" marker-end="url(#ao)"/>

  <text class="msg" x="1030" y="759">handled rate 90/s to 230/s</text>
  <line class="arrow" x1="1264" y1="768" x2="796" y2="768" marker-end="url(#a)"/>

  <rect class="noteboxw" x="620" y="784" width="620" height="50"/>
  <text class="boxtext" x="930" y="803">now past executionThreads x (timeout / handlerDuration): the tail of every</text>
  <text class="boxtext" x="930" y="822">batch expires before it runs, and JOB.TIME_OUT rejections climb</text>

  <!-- ============ phase 5 ============ -->
  <rect class="bandrect" x="46" y="860" width="1308" height="170"/>
  <text class="time"       x="62" y="890">15:59 to 16:08</text>
  <text class="phase"      x="62" y="910">Reclaim attempt</text>
  <text class="trend-flat" x="62" y="932">instances: flat,</text>
  <text class="trend-flat" x="62" y="947">still no change</text>

  <text class="msg" x="825" y="892">five workers to 0, bottleneck to 5 replicas</text>
  <line class="arrow-op" x1="386" y1="901" x2="1264" y2="901" marker-end="url(#ao)"/>

  <text class="msg" x="1030" y="939">completes proof-from-vendor faster</text>
  <line class="arrow-warn" x1="1264" y1="948" x2="796" y2="948" marker-end="url(#aw)"/>

  <rect class="noteboxw" x="640" y="964" width="600" height="50"/>
  <text class="boxtext" x="940" y="983">each one creates a get-vendor-info job, whose worker we just stopped:</text>
  <text class="boxtext" x="940" y="1002">the queue moves one task to the right instead of shrinking</text>

  <!-- ============ phase 6 ============ -->
  <rect class="bandrect" x="46" y="1040" width="1308" height="120"/>
  <text class="time"       x="62" y="1070">16:15 to ~16:50</text>
  <text class="phase"      x="62" y="1090">Starter stopped</text>
  <text class="trend-down" x="62" y="1112">instances: drains</text>
  <text class="trend-down" x="62" y="1127">in ~35 minutes</text>

  <text class="msg" x="480" y="1064">scale to 0</text>
  <line class="arrow-op" x1="386" y1="1073" x2="546" y2="1073" marker-end="url(#ao)"/>
  <line class="term" x1="558" y1="1061" x2="582" y2="1085"/>
  <line class="term" x1="582" y1="1061" x2="558" y2="1085"/>

  <text class="msg" x="1030" y="1108">poll, finally uncontested</text>
  <line class="arrow" x1="1264" y1="1117" x2="796" y2="1117" marker-end="url(#a)"/>
  <text class="note" x="1030" y="1133">no new instances means nothing left to push, so ACTIVATABLE empties</text>
</svg>
