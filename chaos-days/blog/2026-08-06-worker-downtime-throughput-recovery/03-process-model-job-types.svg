<svg viewBox="0 0 1240 460" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The relevant slice of the bank customer complaint and dispute handling process. A dispute is filed, then the Document Request Process subprocess runs the customer_notification job to request documents, waits for the customer to send them back, then runs the extract_data_from_document job to store the information. Only once that subprocess completes does the process move into the Fraud Claim Investigation subprocess, whose Vendor fraud claim validation subprocess runs the dispute_process_request_proof_from_vendor job followed by the dispute_process_request_get_vendor_info job, before continuing on to fraud rating, the refund decision, and informing the customer. The two job types are sequential stages of the same process, not independent parallel branches: a backlog that builds up in extract_data_from_document while its worker is down arrives at dispute_process_request_proof_from_vendor as a burst once the upstream worker comes back, which is why increasing that second worker's capacity looked like the right fix but was not.">
  <style>
    svg {
      --bg:#f4f5f8; --ink:#1c2230; --muted:#5b6472;
      --panel:#ffffff; --panel-border:#c7ccd6; --band-border:#dfe2e8;
      --warn:#a23b2e; --warn-soft:rgba(162,59,46,0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#12151c; --ink:#e6e9ef; --muted:#9aa4b2;
        --panel:#1b1f29; --panel-border:#333a48; --band-border:#242938;
        --warn:#d97a63; --warn-soft:rgba(217,122,99,0.16);
      }
    }
    .bgrect { fill: var(--bg); }
    .title { fill: var(--ink); font-size: 20px; font-weight: 600; text-anchor: middle; }
    .subtitle { fill: var(--muted); font-size: 12px; text-anchor: middle; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .subproc { fill: none; stroke: var(--band-border); stroke-width: 1.5; stroke-dasharray: 6 4; rx: 12; }
    .subproc-label { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.5; rx: 8; }
    .box-warn { fill: var(--panel); stroke: var(--warn); stroke-width: 2; rx: 8; }
    .boxtitle { fill: var(--ink); font-size: 12.5px; text-anchor: middle; font-weight: 600; }
    .jobtype { fill: var(--muted); font-size: 10px; text-anchor: middle; }
    .jobtype-warn { fill: var(--warn); font-size: 10px; text-anchor: middle; font-weight: 700; }
    .ink-line { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .arrowhead-ink { fill: var(--ink); }
    .callout { fill: var(--warn); font-size: 11px; font-weight: 600; }
    .callout-line { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    .event { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="aInk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead-ink" />
    </marker>
  </defs>

  <rect class="bgrect" x="0" y="0" width="1240" height="460" />

  <text class="title" x="620" y="32">Two job types, one process, one after the other</text>
  <text class="subtitle" x="620" y="52">extract_data_from_document and dispute_process_request_proof_from_vendor are sequential stages, not parallel branches</text>

  <circle class="event" cx="45" cy="200" r="18" />
  <text class="jobtype" x="45" y="235">dispute filed</text>

  <rect class="subproc" x="90" y="120" width="380" height="160" />
  <text class="subproc-label" x="110" y="105">Document Request Process</text>

  <rect class="box" x="110" y="155" width="150" height="60" />
  <text class="boxtitle" x="185" y="178">Request documents</text>
  <text class="jobtype mono" x="185" y="195">customer_notification</text>

  <rect class="box-warn" x="290" y="155" width="160" height="60" />
  <text class="boxtitle" x="370" y="176" style="fill:var(--warn);">Store info &amp; get</text>
  <text class="boxtitle" x="370" y="190" style="fill:var(--warn);">customer info</text>
  <text class="jobtype-warn mono" x="370" y="207">extract_data_from_document</text>

  <path class="ink-line" d="M 260,185 H 288" marker-end="url(#aInk)" />

  <path class="callout-line" d="M 370,215 V 245" />
  <text class="callout" x="370" y="260" text-anchor="middle">worker scaled to 0 here</text>

  <path class="ink-line" d="M 470,200 H 520" marker-end="url(#aInk)" />

  <rect class="subproc" x="530" y="90" width="480" height="230" />
  <text class="subproc-label" x="550" y="75">Fraud Claim Investigation</text>

  <rect class="subproc" x="550" y="125" width="260" height="160" />
  <text class="subproc-label" x="566" y="115" style="font-size:10px;">Vendor fraud claim validation</text>

  <rect class="box-warn" x="566" y="150" width="220" height="60" />
  <text class="boxtitle" x="676" y="173" style="fill:var(--warn);">Request proof from vendor</text>
  <text class="jobtype-warn mono" x="676" y="190">dispute_process_request_proof_from_vendor</text>

  <path class="ink-line" d="M 676,210 V 235" marker-end="url(#aInk)" />

  <rect class="box" x="566" y="240" width="220" height="35" />
  <text class="boxtitle" x="676" y="262">Get vendor info</text>

  <path class="callout-line" d="M 786,155 V 100 H 1030 V 275" />
  <text class="callout" x="1030" y="292" text-anchor="start">capacity raised 60 &#8594; 100 here,</text>
  <text class="callout" x="1030" y="306" text-anchor="start">but the surge was backlog</text>
  <text class="callout" x="1030" y="320" text-anchor="start">arriving from upstream</text>

  <path class="ink-line" d="M 810,200 H 850" marker-end="url(#aInk)" />

  <rect class="box" x="860" y="170" width="140" height="60" />
  <text class="boxtitle" x="930" y="193">fraud rating,</text>
  <text class="boxtitle" x="930" y="208">refund decision</text>

  <path class="ink-line" d="M 1000,200 H 1040" marker-end="url(#aInk)" />

  <circle class="event" cx="1080" cy="200" r="18" />
  <text class="jobtype" x="1080" y="235">dispute settled</text>

  <text class="subtitle" x="620" y="345" style="font-style:italic;">A backlog stuck in extract_data_from_document stays invisible to dispute_process_request_proof_from_vendor,</text>
  <text class="subtitle" x="620" y="362" style="font-style:italic;">until the upstream worker comes back and releases it all at once.</text>
</svg>
