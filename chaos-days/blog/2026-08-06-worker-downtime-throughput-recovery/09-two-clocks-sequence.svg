<svg viewBox="0 0 1240 1130" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Sequence diagram of one poll batch through a saturated Camunda job worker, showing why a job can miss its broker deadline without the client ever raising an error. The poll loop asks the broker for a batch sized maxJobsActive minus remainingJobs, a budget that ignores pushed jobs, which is defect 1. The broker returns a batch of N jobs and starts a single deadline clock at that instant, covering every job in the batch. The client then dispatches the batch one job at a time through jobs.forEach, blocking on the semaphore for each, which is defect 3. Job 1 acquires a permit immediately. Job 2 blocks until a permit frees, holding up everything behind it. Job N's call to execute only happens once the jobs ahead of it are done, and only then does its own acquire window begin, a fresh full 1800 milliseconds measured from that moment rather than from activation. In the meantime the broker times job N out at 1800 milliseconds and returns it to the ACTIVATABLE backlog. Job N then acquires its permit comfortably inside its own local window, so nothing throws and nothing is logged, the handler runs, and the completion is rejected because the broker has already given the job away. A rare alternative branch is shown in grey: only if that window expires with every permit still taken does the client raise RejectedExecutionException and leak its in-flight counter, which is defect 2, and that did not happen in this run. A timeline at the bottom compares the clocks directly: one broker deadline bar running from zero to 1800 milliseconds, against three staggered client acquire windows, each 1800 milliseconds long but starting at its own dispatch turn, so job N's window extends well past the point at which the broker has already reclaimed the job.">
  <style>
    svg {
      --bg:#f4f5f8; --ink:#1c2230; --muted:#5b6472;
      --panel:#ffffff; --panel-border:#c7ccd6; --band-border:#dfe2e8;
      --pull:#2f5f8a; --pull-soft:rgba(47,95,138,0.14);
      --warn:#a23b2e; --warn-soft:rgba(162,59,46,0.12);
      --ghost-border:#c7ccd6; --ghost-text:#9aa2af;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      svg:not([data-theme="light"]) {
        --bg:#12151c; --ink:#e6e9ef; --muted:#9aa4b2;
        --panel:#1b1f29; --panel-border:#333a48; --band-border:#242938;
        --pull:#7ea3cc; --pull-soft:rgba(126,163,204,0.18);
        --warn:#d97a63; --warn-soft:rgba(217,122,99,0.16);
        --ghost-border:#333a48; --ghost-text:#6b7280;
      }
    }
    svg[data-theme="dark"] {
      --bg:#12151c; --ink:#e6e9ef; --muted:#9aa4b2;
      --panel:#1b1f29; --panel-border:#333a48; --band-border:#242938;
      --pull:#7ea3cc; --pull-soft:rgba(126,163,204,0.18);
      --warn:#d97a63; --warn-soft:rgba(217,122,99,0.16);
      --ghost-border:#333a48; --ghost-text:#6b7280;
    }
    .bgrect { fill: var(--bg); }
    .title { fill: var(--ink); font-size: 21px; font-weight: 600; text-anchor: middle; }
    .subtitle { fill: var(--muted); font-size: 12.5px; text-anchor: middle; }
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace; }
    .band { fill: none; stroke: var(--band-border); stroke-width: 1.5; rx: 14; }
    .band-label { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1.5; rx: 8; }
    .actor { fill: var(--ink); font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    .actor-sub { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
    .life { stroke: var(--panel-border); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .arrow { stroke: var(--pull); stroke-width: 1.8; fill: none; }
    .arrow-warn { stroke: var(--warn); stroke-width: 2; fill: none; }
    .arrow-ghost { stroke: var(--ghost-border); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .msg { fill: var(--ink); font-size: 11.5px; text-anchor: middle; }
    .note { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
    .note-warn { fill: var(--warn); font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .note-ghost { fill: var(--ghost-text); font-size: 10.5px; text-anchor: middle; }
    .step { fill: var(--muted); font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    .selfbox { fill: var(--pull-soft); stroke: var(--pull); stroke-width: 1.4; rx: 6; }
    .selftext { fill: var(--ink); font-size: 11.5px; text-anchor: middle; }
    .rowlabel { fill: var(--ink); font-size: 12px; text-anchor: end; }
    .rowsub { fill: var(--muted); font-size: 10px; text-anchor: end; }
    .inbar { fill: var(--ink); font-size: 10.5px; font-weight: 600; text-anchor: start; }
    .bar-broker { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.6; rx: 5; }
    .bar-client { fill: var(--pull-soft); stroke: var(--pull); stroke-width: 1.6; rx: 5; }
    .axis { stroke: var(--panel-border); stroke-width: 1.5; }
    .tick { stroke: var(--panel-border); stroke-width: 1.2; }
    .ticklabel { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
    .cut { stroke: var(--warn); stroke-width: 1.8; stroke-dasharray: 5 4; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pull)"/>
    </marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--warn)"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ghost-border)"/>
    </marker>
  </defs>

  <rect class="bgrect" x="0" y="0" width="1240" height="1130"/>

  <text class="title" x="620" y="40">One poll batch through a saturated worker</text>
  <text class="subtitle" x="620" y="63">Why a job can blow its deadline on the broker while the client sees nothing wrong</text>

  <!-- ============ lifelines ============ -->
  <rect class="box" x="70"   y="92" width="200" height="46"/>
  <text class="actor"     x="170" y="113">Broker</text>
  <text class="actor-sub" x="170" y="129">partition stream processor</text>

  <rect class="box" x="380"  y="92" width="220" height="46"/>
  <text class="actor"     x="490" y="113">Poll loop</text>
  <text class="actor-sub" x="490" y="129">JobPollerImpl, one thread</text>

  <rect class="box" x="700"  y="92" width="200" height="46"/>
  <text class="actor"     x="800" y="113">Semaphore</text>
  <text class="actor-sub" x="800" y="129">BlockingExecutor, 60 permits</text>

  <rect class="box" x="980"  y="92" width="190" height="46"/>
  <text class="actor"     x="1075" y="113">Handler pool</text>
  <text class="actor-sub" x="1075" y="129">10 execution threads</text>

  <line class="life" x1="170"  y1="138" x2="170"  y2="812"/>
  <line class="life" x1="490"  y1="138" x2="490"  y2="812"/>
  <line class="life" x1="800"  y1="138" x2="800"  y2="812"/>
  <line class="life" x1="1075" y1="138" x2="1075" y2="812"/>

  <!-- 1: poll request -->
  <text class="step" x="92" y="188">1</text>
  <text class="msg mono" x="332" y="187">ActivateJobs(maxJobsActive - remainingJobs)</text>
  <line class="arrow" x1="488" y1="196" x2="178" y2="196" marker-end="url(#ah)"/>
  <text class="note" x="332" y="212">the budget ignores pushed jobs, so it over-asks (defect 1)</text>

  <!-- 2: batch returned, broker clock starts -->
  <text class="step" x="92" y="252">2</text>
  <text class="msg" x="332" y="251">batch of N jobs</text>
  <line class="arrow-warn" x1="178" y1="260" x2="482" y2="260" marker-end="url(#ahw)"/>
  <text class="note-warn" x="332" y="276">deadline clock starts here, one for the whole batch</text>

  <!-- sequential dispatch -->
  <rect class="selfbox" x="378" y="304" width="224" height="30"/>
  <text class="selftext mono" x="490" y="324">jobs.forEach(jobConsumer)</text>
  <text class="note" x="490" y="350">one job at a time, each blocking (defect 3)</text>

  <!-- 3: job 1 -->
  <text class="step" x="92" y="384">3</text>
  <text class="msg mono" x="645" y="383">execute(job 1)</text>
  <line class="arrow" x1="496" y1="392" x2="792" y2="392" marker-end="url(#ah)"/>
  <text class="note" x="645" y="408">its window opens at t = 0, a permit is free</text>

  <!-- 4: handler runs -->
  <text class="step" x="92" y="438">4</text>
  <text class="msg" x="937" y="437">permit granted, handler runs</text>
  <line class="arrow" x1="808" y1="446" x2="1067" y2="446" marker-end="url(#ah)"/>

  <!-- 5: job 2 waits -->
  <text class="step" x="92" y="482">5</text>
  <text class="msg mono" x="645" y="481">execute(job 2)</text>
  <line class="arrow" x1="496" y1="490" x2="792" y2="490" marker-end="url(#ah)"/>
  <text class="note" x="645" y="506">blocks until a permit frees, holding up all of the rest</text>

  <!-- 6: job N, fresh clock, plus the rare defect-2 branch -->
  <text class="step" x="92" y="550">6</text>
  <text class="msg mono" x="645" y="549">execute(job N)</text>
  <line class="arrow-warn" x1="496" y1="558" x2="792" y2="558" marker-end="url(#ahw)"/>
  <text class="note-warn" x="645" y="574">a fresh, full 1800ms window opens NOW, not at t = 0</text>
  <text class="note-ghost" x="645" y="592">only if that window expires with all permits taken</text>
  <line class="arrow-ghost" x1="792" y1="601" x2="496" y2="601" marker-end="url(#ahg)"/>
  <text class="note-ghost" x="645" y="617">RejectedExecutionException, counter leaks (defect 2)</text>
  <text class="note-ghost" x="645" y="633">did not happen in this run</text>

  <!-- 7: broker times it out -->
  <text class="step" x="92" y="668">7</text>
  <path class="arrow-warn" d="M 178 660 L 240 660 L 240 680 L 182 680" marker-end="url(#ahw)"/>
  <text class="note-warn" x="365" y="666">t = 1800ms on the broker clock:</text>
  <text class="note-warn" x="365" y="682">JOB.TIME_OUT, job N back in ACTIVATABLE</text>

  <!-- 8: permit finally granted -->
  <text class="step" x="92" y="716">8</text>
  <text class="msg" x="937" y="715">permit for job N granted</text>
  <line class="arrow" x1="808" y1="724" x2="1067" y2="724" marker-end="url(#ah)"/>
  <text class="note" x="937" y="740">inside its own window, so nothing throws and nothing is logged</text>

  <!-- 9: completion rejected -->
  <text class="step" x="92" y="780">9</text>
  <text class="msg mono" x="620" y="779">CompleteJob(job N)</text>
  <line class="arrow-warn" x1="1067" y1="788" x2="180" y2="788" marker-end="url(#ahw)"/>
  <text class="note-warn" x="620" y="804">rejected: the broker gave this job away at step 7, so the work is thrown away</text>

  <!-- ============ the two clocks ============ -->
  <rect class="band" x="60" y="838" width="1120" height="260"/>
  <text class="band-label" x="82" y="864">THE TWO CLOCKS</text>
  <text class="note" x="640" y="864">One deadline is started by the broker for the whole batch. One window is started by the client per job, at its own turn in the forEach.</text>

  <line class="cut" x1="700" y1="874" x2="700" y2="1034"/>

  <rect class="bar-broker" x="280" y="882" width="420" height="22"/>
  <text class="rowlabel" x="264" y="895">broker deadline</text>
  <text class="rowsub"   x="264" y="909">all N jobs</text>

  <rect class="bar-client" x="280" y="922" width="420" height="22"/>
  <text class="rowlabel" x="264" y="937">job 1 window</text>

  <rect class="bar-client" x="420" y="962" width="420" height="22"/>
  <text class="rowlabel" x="264" y="977">job 2 window</text>

  <rect class="bar-client" x="630" y="1002" width="420" height="22"/>
  <text class="rowlabel" x="264" y="1017">job N window</text>
  <circle cx="737" cy="1013" r="5" fill="var(--warn)"/>
  <text class="inbar" x="752" y="1017">acquires here</text>

  <line class="axis" x1="280" y1="1042" x2="1120" y2="1042"/>
  <line class="tick" x1="280"  y1="1042" x2="280"  y2="1048"/>
  <line class="tick" x1="490"  y1="1042" x2="490"  y2="1048"/>
  <line class="tick" x1="700"  y1="1042" x2="700"  y2="1048"/>
  <line class="tick" x1="910"  y1="1042" x2="910"  y2="1048"/>
  <line class="tick" x1="1120" y1="1042" x2="1120" y2="1048"/>
  <text class="ticklabel" x="280"  y="1064">0</text>
  <text class="ticklabel" x="490"  y="1064">900ms</text>
  <text class="ticklabel" x="700"  y="1064">1800ms</text>
  <text class="ticklabel" x="910"  y="1064">2700ms</text>
  <text class="ticklabel" x="1120" y="1064">3600ms</text>
  <text class="note-warn" x="700" y="1085">the broker reclaims job N here</text>
</svg>
